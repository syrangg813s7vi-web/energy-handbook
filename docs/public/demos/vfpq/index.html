.physical-story {
  margin-top: 20px;
  border: 1px solid var(--loop-color);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in srgb,var(--loop-color) 45%,#29475f);
  }
  border-radius: 16px;
  background: linear-gradient(145deg,#12283a,#0d1b29);
  overflow: hidden;
}
.story-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid #294054;
  gap: 12px;
}
.story-title>span {
  color: var(--loop-color);
  font-size: 14px;
}
.story-grid {
  display: grid;
  grid-template-columns: 1fr 72px 1fr 72px 1fr;
  align-items: center;
  padding: 22px 24px;
  gap: 8px;
}
.story-grid p {
  color: #b6cadd;
  font-size: 15px;
  margin: 12px 0;
}
.story-grid .card-label {
  color: #e5f1fb;
  font-size: 16px;
  margin: 0 0 18px;
  font-weight: 600;
}
.story-grid small {
  font-size: 13px;
  color: #98b3c9;
}
.big-reading {
  font-size: 40px;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  color: #ffd093;
}
.big-reading small {
  font-size: 18px;
}
.compare-row {
  display: grid;
  grid-template-columns: 32px 1fr 55px;
  gap: 8px;
  align-items: center;
  font-size: 14px;
  margin: 14px 0;
}
.compare-row b {
  font-size: 13px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.compare-track {
  height: 14px;
  background: #071725;
  border-radius: 4px;
  overflow: hidden;
}
.compare-track i {
  display: block;
  height: 100%;
  background: var(--loop-color);
  transition: width .12s linear;
}
.compare-track .target-fill {
  background: #b9c9d7;
}
.causal-arrow {
  font-size: 38px;
  color: var(--loop-color);
  text-align: center;
}
.causal-arrow small {
  display: block;
  font-size: 12px;
  line-height: 1.6;
  white-space: normal;
}
.device-demand {
  text-align: center;
}
.dial {
  display: block;
  width: 205px;
  max-width: 100%;
  height: 125px;
  margin: auto;
}
.dial text {
  font-size: 12px;
  fill: #a9c1d5;
}
.dial g {
  transition: transform .12s linear;
}
.command-reading {
  font-size: 26px;
  color: var(--loop-color);
  font-variant-numeric: tabular-nums;
}
.response-reading {
  display: flex;
  gap: 10px;
  align-items: baseline;
}
.response-reading strong {
  font-size: 40px;
  color: var(--loop-color);
  font-variant-numeric: tabular-nums;
}
.response-reading span {
  color: #a9c1d5;
}
.ruler {
  height: 62px;
  background: repeating-linear-gradient(90deg,#2c4860 0px,#2c4860 1px,transparent 1px,transparent 10%);
  border-bottom: 1px solid #527088;
  position: relative;
  margin: 22px 6px 10px;
}
.gap-zone {
  position: absolute;
  height: 100%;
  background: #ffcb8230;
  transition: width .12s linear,left .12s linear;
}
.target-pin {
  position: absolute;
  top: 0;
  height: 100%;
  border-left: 2px dashed #d8e4ee;
  transform: translateX(-1px);
}
.actual-pin {
  position: absolute;
  top: 16px;
  height: 36px;
  width: 5px;
  background: var(--loop-color);
  transform: translateX(-2px);
  transition: left .12s linear;
}
.actual-pin:before {
  content: '';
  position: absolute;
  top: -5px;
  left: -4px;
  border-radius: 50%;
  width: 13px;
  height: 13px;
  background: var(--loop-color);
}
.ruler-key {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #b9cbd9;
}
.ruler-key span:first-child {
  color: var(--loop-color);
}
.story-return {
  border-top: 1px solid #294054;
  padding: 12px 24px;
  color: var(--loop-color);
  font-size: 15px;
}
.story-return span {
  color: #9eb6ca;
  font-size: 13px;
  margin-left: 20px;
}
@media (max-width:900px) {
  .story-grid {
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .causal-arrow {
    transform: none;
    font-size: 0;
  }
  .causal-arrow:before {
    content: '↓';
    font-size: 28px;
  }
  .causal-arrow small {
    font-size: 13px;
  }
  .story-grid>div {
    width: 100%;
    max-width: 480px;
    margin: auto;
  }
  .story-return span {
    display: block;
    margin: 6px 0 0;
  }
  .story-title {
    flex-wrap: wrap;
  }
}
@media (prefers-reduced-motion:reduce) {
  .physical-story * {
    transition: none !important;
  }
}
:root {
  --background: #08121d;
  --foreground: #eaf2fa;
  --primary: #66b5ff;
  --primary-foreground: #07121d;
  --muted: #223449;
  --border: #2b3d50;
  --ring: #66b5ff;
  --radius: .7rem;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #08121d;
  color: #eaf2fa;
  font-family: Arial,"PingFang SC",sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
main {
  max-width: 1460px;
  margin: auto;
  padding: 28px 32px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
}
.eyebrow {
  font-size: 14px;
  color: #9baec2;
  margin: 0 0 6px;
}
h1 {
  font-size: 28px;
  margin: 0;
  font-weight: 650;
}
h2 {
  font-size: 18px;
  margin: 0;
}
.status {
  color: #b6c8d9;
  font-size: 14px;
}
nav {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
  margin: 24px 0 18px;
}
.mode-button {
  height: auto !important;
  justify-content: start !important;
  padding: 14px 20px !important;
  background: #101f2e !important;
  border: 1px solid #2b3d50 !important;
  color: #c0d0df !important;
  gap: 16px !important;
}
.mode-button b {
  font-size: 30px;
}
.mode-button span {
  font-size: 16px;
  text-align: left;
}
.mode-button small {
  display: block;
  font-size: 14px;
  color: #8ea4ba;
}
.mode-button.chosen {
  border-color: var(--loop-color) !important;
  background: var(--loop-color) !important;
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb,var(--loop-color) 10%,#101f2e) !important;
  }
  color: var(--loop-color) !important;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 32px;
  justify-content: space-between;
  padding: 18px 22px;
  background: #102131;
  border: 1px solid #2b3d50;
  border-radius: 12px;
}
.target-control {
  width: 360px;
  max-width: 100%;
}
.target-control label {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 16px;
}
.target-control strong {
  color: var(--loop-color);
  font-size: 18px;
}
.target-control p {
  font-size: 14px;
  color: #a8bace;
  margin: 0;
}
.target-control [data-slot="slider-range"] {
  background: var(--loop-color);
}
.target-control [data-slot="slider-track"] {
  background: #30475d;
  height: 5px;
}
.target-control [data-slot="slider-thumb"] {
  width: 17px;
  height: 17px;
  background: var(--loop-color);
}
.actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.actions button {
  height: 40px;
  padding: 0 14px;
  background: #20374c;
  color: #eaf2fa;
  border: 1px solid #39536c;
  font-size: 14px;
}
.actions button:first-child {
  background: var(--loop-color);
  color: #07121d;
}
.main-panel,.chart-panel,aside {
  margin-top: 18px;
  border: 1px solid #2b3d50;
  background: #0d1b29;
  border-radius: 14px;
  overflow: hidden;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  border-bottom: 1px solid #25394c;
}
.section-head h2 b {
  color: var(--loop-color);
}
.section-head h2 span {
  font-size: 14px;
  color: #9fb3c7;
  font-weight: 400;
  margin-left: 14px;
}
.section-head>span {
  font-size: 14px;
  color: #a9bbce;
}
.section-head .limit {
  color: #ffbf77;
}
.steps {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 8px;
  padding: 16px 22px 0;
}
.steps>div {
  padding: 9px 8px;
  border-radius: 7px;
  color: #90a7bd;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.steps b {
  border: 1px solid #385066;
  border-radius: 50%;
  width: 25px;
  height: 25px;
  display: inline-grid;
  place-items: center;
}
.steps .current {
  color: var(--loop-color);
  background: var(--loop-color);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb,var(--loop-color) 10%,transparent);
  }
}
.steps .current b {
  border-color: var(--loop-color);
}
.diagram-scroll {
  overflow-x: auto;
}
.diagram {
  display: block;
  width: 100%;
  min-width: 850px;
  color: var(--loop-color);
}
.diagram text {
  text-anchor: middle;
  fill: #d4e3f0;
  font-size: 16px;
}
.diagram .small {
  font-size: 14px;
  fill: #9eb4c9;
}
.diagram .value {
  font-size: 18px;
  font-weight: 600;
}
.diagram .annotation {
  font-size: 14px;
  fill: #a7bed3;
}
.block rect,.block circle {
  fill: #152a3b;
  stroke: #425b70;
  stroke-width: 1.5;
}
.block.selected rect,.block.selected circle {
  stroke: var(--loop-color);
  stroke-width: 2;
  fill: var(--loop-color);
  @supports (color: color-mix(in lab, red, red)) {
    fill: color-mix(in srgb,var(--loop-color) 10%,#152a3b);
  }
}
.wire {
  fill: none;
  stroke: #58758e;
  stroke-width: 2;
  color: #58758e;
}
.wire.active {
  stroke: var(--loop-color);
  color: var(--loop-color);
  stroke-width: 3;
  stroke-dasharray: 8 5;
}
.running .wire.active {
  animation: flow .8s linear infinite;
}
.explanation {
  background: #12283b;
  border-top: 1px solid #2b3d50;
  padding: 16px 22px;
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 18px;
  min-height: 92px;
}
.explanation strong {
  color: var(--loop-color);
  font-size: 16px;
}
.explanation p {
  margin: 0;
  color: #d0dfe9;
}
.bottom {
  display: grid;
  grid-template-columns: 1.65fr 1fr;
  gap: 18px;
}
.chart-panel svg {
  width: 100%;
  display: block;
  padding: 14px;
}
.chart-panel svg text {
  font-size: 14px;
  fill: #9fb6ca;
}
.gridline {
  stroke: #293f53;
  stroke-width: 1;
}
.target-line {
  stroke: #d5e0e9;
  stroke-width: 2;
  stroke-dasharray: 7 5;
  fill: none;
}
.actual-line {
  stroke: var(--loop-color);
  stroke-width: 2.8;
  fill: none;
}
.dash,.solid {
  display: inline-block;
  width: 22px;
  border-top: 2px dashed #d5e0e9;
  vertical-align: middle;
  margin: 0 6px 0 14px;
}
.solid {
  border-top: 3px solid var(--loop-color);
}
aside {
  padding: 20px 22px;
}
aside p {
  color: #aebfd0;
  margin: 14px 0;
  font-size: 15px;
}
.relation {
  padding: 12px;
  background: #193046;
  border-radius: 8px;
  color: var(--loop-color);
  font-size: 18px;
  margin-top: 16px;
}
.note {
  border-top: 1px solid #2b3d50;
  padding-top: 12px;
}
footer {
  font-size: 13px;
  color: #94a9bd;
  padding: 22px 0 10px;
}
@keyframes flow {
  to {
    stroke-dashoffset: -26;
  }
}
@media (prefers-reduced-motion:reduce) {
  .running .wire.active {
    animation: none;
  }
}
@media (max-width:1050px) {
  .toolbar {
    align-items: stretch;
    flex-direction: column;
    gap: 20px;
  }
  .target-control {
    width: 100%;
  }
  .bottom {
    grid-template-columns: 1fr;
  }
  .section-head {
    flex-wrap: wrap;
  }
}
@media (max-width:650px) {
  main {
    padding: 20px 14px;
  }
  header {
    display: block;
  }
  h1 {
    font-size: 24px;
  }
  .status {
    display: block;
    margin-top: 8px;
  }
  nav {
    grid-template-columns: 1fr 1fr;
  }
  .mode-button {
    padding: 10px !important;
  }
  .steps {
    display: flex;
    overflow: auto;
  }
  .steps>div {
    white-space: nowrap;
  }
  .explanation {
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .section-head h2 span {
    display: block;
    margin: 6px 0 0;
  }
  .diagram-scroll:before {
    content: '左右滑动查看完整反馈回路 →';
    display: block;
    font-size: 13px;
    color: #9fb6ca;
    padding: 14px 20px 0;
  }
}
