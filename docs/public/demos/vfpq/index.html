:root {
  --background: #f2f5f8;
  --foreground: #213348;
  --primary: #2365aa;
  --primary-foreground: #fff;
  --muted: #dce5ed;
  --border: #dce4ec;
  --ring: #2365aa;
  --radius: .6rem;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font: 15px/1.55 Arial,"PingFang SC",sans-serif;
}
main {
  max-width: 1640px;
  margin: auto;
  padding: 22px 24px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 16px;
}
h1 {
  font-size: 23px;
  margin: 0;
  font-weight: 650;
}
h2 {
  font-size: 16px;
  margin: 0;
}
.eyebrow {
  font-size: 13px;
  margin: 0 0 4px;
  color: #64768b;
}
.status {
  font-size: 13px;
  color: #60748a;
}
.workspace {
  display: grid;
  grid-template-columns: 192px minmax(460px,1fr) 330px;
  gap: 18px;
  align-items: start;
}
.control-panel,.main-panel,.bottom {
  background: #fff;
  border: 1px solid #dfe6ee;
  border-radius: 12px;
}
.control-panel {
  padding: 14px;
}
nav {
  display: grid;
  gap: 8px;
}
.mode-button {
  height: auto !important;
  width: 100%;
  justify-content: flex-start !important;
  padding: 10px 12px !important;
  gap: 14px !important;
  background: #f6f8fa !important;
  color: #4e6075 !important;
  border: 1px solid transparent !important;
}
.mode-button b {
  font-size: 24px;
}
.mode-button span {
  text-align: left;
  font-size: 14px;
}
.mode-button small {
  display: block;
  font-size: 12px;
  color: #6d7f91;
}
.mode-button.chosen {
  background: var(--loop-color) !important;
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb,var(--loop-color) 8%,white) !important;
  }
  border-color: var(--loop-color) !important;
  @supports (color: color-mix(in lab, red, red)) {
    border-color: color-mix(in srgb,var(--loop-color) 30%,white) !important;
  }
  color: var(--loop-color) !important;
}
.toolbar {
  padding-top: 24px;
}
.target-control label {
  font-size: 13px;
  display: block;
  margin-bottom: 18px;
}
.target-control strong {
  display: block;
  font-size: 20px;
  color: var(--loop-color);
  margin-top: 5px;
  font-variant-numeric: tabular-nums;
}
.target-control p {
  font-size: 13px;
  color: #63768b;
}
.target-control [data-slot="slider-track"] {
  height: 5px;
  background: #dce5ed;
}
.target-control [data-slot="slider-range"] {
  background: var(--loop-color);
}
.target-control [data-slot="slider-thumb"] {
  height: 16px;
  width: 16px;
  background: #fff;
  border: 2px solid var(--loop-color);
}
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 26px;
}
.actions button {
  height: 38px;
  padding: 0 6px;
  background: #eef3f7;
  color: #304a62;
  border: 1px solid #dce5ed;
  font-size: 13px;
}
.actions button:first-child {
  grid-column: 1/-1;
  background: var(--loop-color);
  color: white;
  border-color: var(--loop-color);
}
.actions button:last-child {
  grid-column: 1/-1;
}
.section-head {
  padding: 18px 18px 12px;
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
}
.section-head h2 b {
  color: var(--loop-color);
}
.section-head h2 span {
  display: block;
  font-size: 13px;
  font-weight: 400;
  color: #6b7b8d;
  margin-top: 4px;
}
.section-head>span {
  font-size: 12px;
  color: #6b7b8d;
  max-width: 125px;
}
.section-head .limit {
  color: #9b5617;
}
.steps {
  display: flex;
  justify-content: space-between;
  margin: 4px 18px 16px;
  gap: 4px;
}
.steps>div {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: #738397;
  padding: 6px;
  border-radius: 6px;
}
.steps b {
  font-size: 11px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #edf1f5;
  display: inline-grid;
  place-items: center;
}
.steps .current {
  background: var(--loop-color);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb,var(--loop-color) 8%,white);
  }
  color: var(--loop-color);
}
.steps .current b {
  background: var(--loop-color);
  color: #fff;
}
.compact-readings {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  padding: 0 18px;
  gap: 10px;
}
.compact-readings span {
  font-size: 12px;
  color: #6b7b8d;
  padding: 8px 10px;
  background: #f7f9fb;
  border-radius: 7px;
}
.compact-readings b {
  display: block;
  font-size: 16px;
  color: #30465c;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.diagram {
  width: 100%;
  display: block;
  padding: 4px 12px 8px;
}
.diagram text {
  text-anchor: middle;
  fill: #2e475f;
  font-size: 18px;
}
.diagram .small {
  font-size: 15px;
  fill: #697e90;
}
.diagram .value {
  font-size: 17px;
  font-weight: 600;
}
.diagram .annotation {
  font-size: 15px;
  fill: #6f8191;
}
.block rect,.block circle {
  fill: #fafcfe;
  stroke: #c9d6e0;
  stroke-width: 1.5;
}
.block.selected rect,.block.selected circle {
  fill: var(--loop-color);
  @supports (color: color-mix(in lab, red, red)) {
    fill: color-mix(in srgb,var(--loop-color) 5%,white);
  }
  stroke: var(--loop-color);
  stroke-width: 2;
}
.wire {
  fill: none;
  stroke: #a5b7c6;
  stroke-width: 2;
}
.wire.active {
  stroke: var(--loop-color);
  stroke-width: 3;
}
.running .wire.active {
  stroke-dasharray: 6 5;
  animation: flow 1.8s linear infinite;
}
.bottom {
  overflow: hidden;
}
.chart-panel .section-head {
  padding-bottom: 0;
}
.chart-panel svg {
  width: 100%;
  display: block;
  padding: 8px 12px;
}
.chart-panel svg text {
  fill: #63798e;
  font-size: 12px;
}
.gridline {
  stroke: #e5ebf1;
  stroke-width: 1;
}
.target-line {
  fill: none;
  stroke: #8a98a6;
  stroke-width: 1.6;
  stroke-dasharray: 5 4;
}
.actual-line {
  fill: none;
  stroke: var(--loop-color);
  stroke-width: 2.4;
}
.dash,.solid {
  display: inline-block;
  width: 13px;
  border-top: 2px dashed #8998a7;
  margin: 0 3px;
  vertical-align: middle;
}
.solid {
  border-top: 2px solid var(--loop-color);
}
.explanation {
  padding: 16px 18px;
  background: #f6f9fc;
  min-height: 130px;
  border-top: 1px solid #e6edf3;
}
.explanation strong {
  font-size: 14px;
  color: var(--loop-color);
}
.explanation p {
  font-size: 14px;
  margin: 8px 0 0;
  color: #4e657b;
}
aside {
  padding: 16px 18px;
  border-top: 1px solid #e6edf3;
}
aside h2 {
  font-size: 14px;
}
aside p {
  font-size: 13px;
  color: #60778c;
  margin: 10px 0;
}
.relation {
  font-size: 15px;
  color: var(--loop-color);
  margin-top: 10px;
}
.note {
  padding-top: 10px;
  border-top: 1px solid #e5ecf2;
}
footer {
  font-size: 12px;
  color: #7b8997;
  padding: 16px 0 0;
  max-width: 1080px;
}
@keyframes flow {
  to {
    stroke-dashoffset: -22;
  }
}
@media (prefers-reduced-motion:reduce) {
  .running .wire.active {
    animation: none;
  }
}
@media (min-width:1500px) {
  .diagram {
    max-height: 500px;
  }
  .workspace {
    grid-template-columns: 210px minmax(460px,1fr) 360px;
  }
}
@media (max-width:1120px) {
  .workspace {
    grid-template-columns: 170px minmax(0,1fr);
  }
  .bottom {
    grid-column: 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .bottom aside {
    grid-column: 1/-1;
  }
  .control-panel {
    grid-row: 1/3;
  }
  .compact-readings b {
    font-size: 14px;
  }
}
@media (max-width:700px) {
  main {
    padding: 16px 12px;
  }
  header {
    display: block;
  }
  h1 {
    font-size: 20px;
  }
  .workspace {
    display: block;
  }
  .control-panel {
    margin-bottom: 14px;
  }
  nav {
    grid-template-columns: repeat(4,1fr);
    gap: 4px;
  }
  .mode-button {
    padding: 7px !important;
    justify-content: center !important;
  }
  .mode-button span {
    display: none;
  }
  .toolbar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding-top: 14px;
  }
  .actions {
    margin: 0;
  }
  .target-control strong {
    font-size: 18px;
  }
  .bottom {
    display: block;
    margin-top: 14px;
  }
  .steps {
    margin: 6px 8px 12px;
  }
  .steps>div {
    font-size: 12px;
    padding: 3px;
  }
  .compact-readings {
    padding: 0 10px;
    gap: 4px;
  }
  .compact-readings span {
    padding: 6px;
  }
  .compact-readings b {
    font-size: 12px;
  }
  .diagram {
    padding: 4px;
  }
  .explanation {
    min-height: 0;
  }
}
