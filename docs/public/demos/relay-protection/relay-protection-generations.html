  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

#widget &gt; svg {

.text-destructive {

          edgeLabels: [&#x27;SV与状态&#x27;, &#x27;本地数据&#x27;, &#x27;站域数据&#x27;, &#x27;交叉校验&#x27;, &#x27;GOOSE命令&#x27;, &#x27;出口回路&#x27;],
          details: [
            &#x27;PIU集成采样、开入开出和设备状态，把过程信息数字化。&#x27;,
            &#x27;A、B冗余实时网络同时传输SV、GOOSE、质量和时间同步信息。&#x27;,
            &#x27;边缘IED保留毫秒级、独立、确定性的主保护与安全降级能力。&#x27;,
            &#x27;多个虚拟IED在冗余实时服务器上分别保护线路、母线和变压器。&#x27;,
            &#x27;站域功能综合多间隔、拓扑和设备状态，协调主保护与后备保护。&#x27;,
            &#x27;经过确定性规则确认后，命令送到PIU或智能终端执行；AI主要辅助诊断。&#x27;,
            &#x27;断路器完成物理分闸，本地和站域系统共同确认结果并准备后备动作。&#x27;
          ]
        }
      ];

      let generationIndex = 0;
      let stepIndex = 0;
      let timer = null;
      let geometry = null;

      function svgEl(tag, attrs = {}) {
        const el = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([key, value]) =&gt; el.setAttribute(key, value));
        return el;
      }

      function nodeLines(label) {
        return label.split(&#x27; / &#x27;).length &gt; 1 &amp;&amp; label.length &gt; 11 ? label.split(&#x27; / &#x27;) : [label];
      }

      function layoutFor(width, count) {
        const narrow = width &lt; 520;
        const marginX = narrow ? 14 : 20;
        const nodeW = narrow ? Math.min(146, width * 0.42) : Math.min(120, (width - 40) / count - 18);
        const nodeH = 56;
        const positions = [];
        if (!narrow) {
          const gap = (width - marginX * 2 - nodeW * count) / Math.max(1, count - 1);
          for (let i = 0; i &lt; count; i++) positions.push({ x: marginX + i * (nodeW + gap), y: 96 });
          return { positions, nodeW, nodeH, height: 260, narrow };
        }
        const leftX = marginX;
        const rightX = width - marginX - nodeW;
        const rowGap = 72;
        for (let i = 0; i &lt; count; i++) {
          const row = Math.floor(i / 2);
          const evenRow = row % 2 === 0;
          const col = i % 2;
          const x = evenRow ? (col === 0 ? leftX : rightX) : (col === 0 ? rightX : leftX);
          positions.push({ x, y: 24 + row * rowGap });
        }
        return { positions, nodeW, nodeH, height: 24 + Math.ceil(count / 2) * rowGap + 62, narrow };
      }

      function pathBetween(a, b, nodeW, nodeH, narrow) {
        if (!narrow || Math.abs(a.y - b.y) &lt; 4) {
          return {
            d: `M ${a.x + nodeW} ${a.y + nodeH / 2} L ${b.x} ${b.y + nodeH / 2}`,
            sx: a.x + nodeW,
            sy: a.y + nodeH / 2,
            ex: b.x,
            ey: b.y + nodeH / 2,
            lx: (a.x + nodeW + b.x) / 2,
            ly: a.y + nodeH / 2 - 9
          };
        }
        const sx = a.x + nodeW / 2;
        const sy = a.y + nodeH;
        const ex = b.x + nodeW / 2;
        const ey = b.y;
        const midY = (sy + ey) / 2;
        return {
          d: `M ${sx} ${sy} C ${sx} ${midY}, ${ex} ${midY}, ${ex} ${ey}`,
          sx, sy, ex, ey,
          lx: (sx + ex) / 2,
          ly: midY - 4
        };
      }

      function renderDiagram() {
        const data = generations[generationIndex];
        const width = Math.max(300, Math.floor(svg.getBoundingClientRect().width || root.getBoundingClientRect().width || 736));
        geometry = layoutFor(width, data.nodes.length);
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${geometry.height}`);
        svg.style.height = `${geometry.height}px`;
        svg.replaceChildren();

        const defs = svgEl(&#x27;defs&#x27;);
        const marker = svgEl(&#x27;marker&#x27;, {
          id: &#x27;relay-arrowhead&#x27;, markerWidth: &#x27;8&#x27;, markerHeight: &#x27;8&#x27;, refX: &#x27;7&#x27;, refY: &#x27;4&#x27;, orient: &#x27;auto&#x27;, markerUnits: &#x27;strokeWidth&#x27;
        });
        marker.appendChild(svgEl(&#x27;path&#x27;, { d: &#x27;M 0 0 L 8 4 L 0 8 z&#x27;, fill: &#x27;var(--border)&#x27; }));
        defs.appendChild(marker);
        svg.appendChild(defs);

        geometry.paths = [];
        for (let i = 0; i &lt; data.nodes.length - 1; i++) {
          const p = pathBetween(geometry.positions[i], geometry.positions[i + 1], geometry.nodeW, geometry.nodeH, geometry.narrow);
          geometry.paths.push(p);
          const path = svgEl(&#x27;path&#x27;, { d: p.d, class: &#x27;relay-edge&#x27;, &#x27;data-edge&#x27;: String(i), &#x27;marker-end&#x27;: &#x27;url(#relay-arrowhead)&#x27; });
          svg.appendChild(path);
          const label = svgEl(&#x27;text&#x27;, { x: p.lx, y: p.ly, class: &#x27;relay-edge-label&#x27; });
          label.textContent = data.edgeLabels[i] || &#x27;&#x27;;
          svg.appendChild(label);
        }

        data.nodes.forEach((label, i) =&gt; {
          const pos = geometry.positions[i];
          const group = svgEl(&#x27;g&#x27;, { class: &#x27;relay-node&#x27;, &#x27;data-node&#x27;: String(i) });
          group.appendChild(svgEl(&#x27;rect&#x27;, { x: pos.x, y: pos.y, width: geometry.nodeW, height: geometry.nodeH, rx: &#x27;8&#x27; }));
          const lines = nodeLines(label);
          lines.forEach((line, lineIndex) =&gt; {
            const textNode = svgEl(&#x27;text&#x27;, {
              x: pos.x + geometry.nodeW / 2,
              y: pos.y + geometry.nodeH / 2 + (lineIndex - (lines.length - 1) / 2) * 15
            });
            textNode.textContent = line;
            group.appendChild(textNode);
          });
          svg.appendChild(group);
        });

        const packet = svgEl(&#x27;circle&#x27;, { r: &#x27;5&#x27;, class: &#x27;relay-packet&#x27;, id: &#x27;relay-packet&#x27; });
        svg.appendChild(packet);
        updateState(false);
      }

      function movePacket(edgeIndex) {
        if (edgeIndex &lt; 0 || !geometry?.paths[edgeIndex]) return;
        const packet = svg.querySelector(&#x27;#relay-packet&#x27;);
        const p = geometry.paths[edgeIndex];
        packet.classList.remove(&#x27;is-moving&#x27;);
        packet.style.transition = &#x27;none&#x27;;
        packet.setAttribute(&#x27;cx&#x27;, p.sx);
        packet.setAttribute(&#x27;cy&#x27;, p.sy);
        requestAnimationFrame(() =&gt; {
          packet.classList.add(&#x27;is-moving&#x27;);
          packet.style.transition = reducedMotion ? &#x27;none&#x27; : &#x27;cx 520ms ease, cy 520ms ease, opacity 140ms ease&#x27;;
          packet.setAttribute(&#x27;cx&#x27;, p.ex);
          packet.setAttribute(&#x27;cy&#x27;, p.ey);
          window.setTimeout(() =&gt; packet.classList.remove(&#x27;is-moving&#x27;), reducedMotion ? 80 : 600);
        });
      }

      function updateState(animateEdge = true) {
        const data = generations[generationIndex];
        titleEl.textContent = data.title;
        changeEl.textContent = data.change;
        counterEl.textContent = `步骤 ${stepIndex + 1} / ${data.nodes.length}`;
        detailEl.innerHTML = `&lt;strong&gt;${data.nodes[stepIndex]}：&lt;/strong&gt;${data.details[stepIndex]}`;
        svg.querySelectorAll(&#x27;.relay-node&#x27;).forEach((node, i) =&gt; {
          node.classList.toggle(&#x27;is-done&#x27;, i &lt; stepIndex);
          node.classList.toggle(&#x27;is-active&#x27;, i === stepIndex);
        });
        svg.querySelectorAll(&#x27;.relay-edge&#x27;).forEach((edge, i) =&gt; {
          edge.classList.toggle(&#x27;is-done&#x27;, i &lt; stepIndex - 1);
          edge.classList.toggle(&#x27;is-active&#x27;, i === stepIndex - 1);
        });
        if (animateEdge &amp;&amp; stepIndex &gt; 0) movePacket(stepIndex - 1);
        prevBtn.disabled = stepIndex === 0;
        nextBtn.disabled = stepIndex === data.nodes.length - 1;
      }

      function stopPlayback() {
        if (timer) window.clearInterval(timer);
        timer = null;
        playBtn.classList.add(&#x27;btn-primary&#x27;);
        playBtn.innerHTML = &#x27;&lt;i data-lucide=&quot;play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;播放&#x27;;
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function startPlayback() {
        stopPlayback();
        if (stepIndex &gt;= generations[generationIndex].nodes.length - 1) {
          stepIndex = 0;
          updateState(false);
        }
        playBtn.classList.remove(&#x27;btn-primary&#x27;);
        playBtn.innerHTML = &#x27;&lt;i data-lucide=&quot;pause&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;暂停&#x27;;
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        timer = window.setInterval(() =&gt; {
          if (stepIndex &gt;= generations[generationIndex].nodes.length - 1) {
            stopPlayback();
            return;
          }
          stepIndex += 1;
          updateState(true);
        }, reducedMotion ? 1400 : 1100);
      }

      playBtn.addEventListener(&#x27;click&#x27;, () =&gt; timer ? stopPlayback() : startPlayback());
      prevBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
        stopPlayback();
        stepIndex = Math.max(0, stepIndex - 1);
        updateState(false);
      });
      nextBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
        stopPlayback();
        stepIndex = Math.min(generations[generationIndex].nodes.length - 1, stepIndex + 1);
        updateState(true);
      });
      resetBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
        stopPlayback();
        stepIndex = 0;
        updateState(false);
      });
      genButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        stopPlayback();
        generationIndex = Number(button.dataset.gen);
        stepIndex = 0;
        genButtons.forEach((peer, index) =&gt; {
          const selected = index === generationIndex;
          peer.classList.toggle(&#x27;btn-primary&#x27;, selected);
          peer.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
        });
        renderDiagram();
      }));

      let resizeTimer = null;
      const observer = new ResizeObserver(() =&gt; {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(renderDiagram, 80);
      });
      observer.observe(root);
      renderDiagram();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }

    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)

    );

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }

  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {

    }

    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);

    }

  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
