<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1360" viewBox="0 0 680 1360" role="img" aria-labelledby="title desc">
  <title id="title">变电站保护控制闭环</title><desc id="desc">手机纵向图。一次系统传输电能，二次系统完成感知、判断、命令、执行和反馈。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbfa"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#118675"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#357eac"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc4f63"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#183640}.title{font-size:33px;font-weight:760}.band{font-size:24px;font-weight:760}.nt{font-size:25px;font-weight:760}.ns{font-size:19px;fill:#566d76}.edge{font-size:18px;font-weight:700}.note{font-size:21px;fill:#526a74}</style></defs>
  <rect width="680" height="1360" rx="30" fill="url(#bg)"/><text x="40" y="58" class="title">一次能量链 × 二次保护闭环</text>
  <g transform="translate(40 92)"><rect width="600" height="520" rx="24" fill="#fffaf2" stroke="#eca64a" stroke-width="2" stroke-dasharray="8 7"/><text x="28" y="48" class="band" fill="#a85d00">一次系统｜承载并开断电能</text>
    <g text-anchor="middle"><g transform="translate(85 78)"><rect width="430" height="82" rx="18" fill="#fff" stroke="#7f929b" stroke-width="2"/><text x="215" y="36" class="nt">进线 / 主变</text><text x="215" y="64" class="ns">电能进入</text></g><g transform="translate(85 188)"><rect width="430" height="82" rx="18" fill="#fff3ed" stroke="#e87745" stroke-width="2"/><text x="215" y="36" class="nt">母线</text><text x="215" y="64" class="ns">汇集与分配</text></g><g transform="translate(85 298)"><rect width="430" height="82" rx="18" fill="#fff0f3" stroke="#df5268" stroke-width="2"/><text x="215" y="36" class="nt">断路器</text><text x="215" y="64" class="ns">开合与切除故障</text></g><g transform="translate(85 408)"><rect width="430" height="82" rx="18" fill="#fff" stroke="#7f929b" stroke-width="2"/><text x="215" y="36" class="nt">出线 / 负荷</text><text x="215" y="64" class="ns">电能送出</text></g></g>
    <g stroke="#118675" stroke-width="4" marker-end="url(#g)"><path d="M300 160V180"/><path d="M300 270V290"/><path d="M300 380V400"/></g>
  </g>
  <g transform="translate(160 620)"><rect width="360" height="52" rx="18" fill="#fff" stroke="#d9dfe5" stroke-width="2"/><text x="180" y="33" text-anchor="middle" class="edge"><tspan fill="#dc4f63">↑ 跳合闸命令</tspan><tspan fill="#87939a">　·　</tspan><tspan fill="#7651c7">↓ 位置 / 电流反馈</tspan></text></g>
  <g transform="translate(40 686)"><rect width="600" height="470" rx="24" fill="#f3f9fc" stroke="#5c9fc5" stroke-width="2" stroke-dasharray="8 7"/><text x="28" y="48" class="band" fill="#1c719d">二次系统｜信息与控制命令</text>
    <g text-anchor="middle"><g transform="translate(85 78)"><rect width="430" height="82" rx="18" fill="#f4efff" stroke="#8b5de5" stroke-width="2"/><text x="215" y="36" class="nt">CT / VT / MU</text><text x="215" y="64" class="ns">采集电流、电压与状态</text></g><g transform="translate(85 188)"><rect width="430" height="82" rx="18" fill="#e9f8f3" stroke="#13977f" stroke-width="2"/><text x="215" y="36" class="nt">保护与测控</text><text x="215" y="64" class="ns">判断故障、执行联锁</text></g><g transform="translate(85 298)"><rect width="430" height="82" rx="18" fill="#e7f5fb" stroke="#2096bd" stroke-width="2"/><text x="215" y="36" class="nt">站控与远动</text><text x="215" y="64" class="ns">监视、操作、上送调度</text></g><g transform="translate(85 408)"><rect width="430" height="42" rx="16" fill="#fff" stroke="#7f929b" stroke-width="2"/><text x="215" y="29" class="ns">运行人员 / 调度</text></g></g>
    <g stroke="#357eac" stroke-width="4" marker-end="url(#b)"><path d="M300 160V180"/><path d="M300 270V290"/><path d="M300 380V400"/></g>
  </g>
  <g transform="translate(40 1190)"><rect width="600" height="126" rx="22" fill="#fff" stroke="#d7e3e7"/><text x="28" y="44" class="nt">感知 → 判断 → 命令 → 执行 → 反馈</text><text x="28" y="82" class="note">保护负责判断，断路器负责执行；</text><text x="28" y="111" class="note">位置、电流和状态用于确认动作结果。</text></g>
</svg>
