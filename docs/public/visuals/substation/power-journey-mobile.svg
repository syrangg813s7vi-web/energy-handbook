<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1420" viewBox="0 0 680 1420" role="img" aria-labelledby="title desc">
  <title id="title">电力从发电侧到用户的旅程</title><desc id="desc">手机纵向图。电能经过发电、升压、输电、降压和配电到达用户。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3fbf9"/><stop offset="1" stop-color="#eef5fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#12847a"/></marker><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#143a45" flood-opacity=".10"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17343e}.title{font-size:34px;font-weight:760}.sub{font-size:22px;fill:#536a73}.nt{font-size:28px;font-weight:760}.ns{font-size:20px;fill:#536a73}.edge{font-size:19px;font-weight:700;fill:#12847a}.formula{font-size:28px;font-weight:760}.small{font-size:21px;fill:#526a74}</style></defs>
  <rect width="680" height="1420" rx="30" fill="url(#bg)"/><text x="44" y="62" class="title">电力为什么要先升压，再降压</text><text x="44" y="102" class="sub">高电压让电能更高效地走得更远</text>
  <g stroke="#12847a" stroke-width="5" marker-end="url(#arrow)"><path d="M340 242V278"/><path d="M340 408V444"/><path d="M340 574V610"/><path d="M340 740V776"/><path d="M340 906V942"/></g>
  <g filter="url(#shadow)" text-anchor="middle">
    <g transform="translate(100 132)"><rect width="480" height="110" rx="20" fill="#fff" stroke="#78909a" stroke-width="2"/><text x="240" y="48" class="nt">发电侧</text><text x="240" y="82" class="ns">火电 / 水电 / 风电 / 光伏</text></g>
    <g transform="translate(100 298)"><rect width="480" height="110" rx="20" fill="#e7f8f3" stroke="#0e9b82" stroke-width="2"/><text x="240" y="48" class="nt">升压变电站</text><text x="240" y="82" class="ns">提高电压，降低电流</text></g>
    <g transform="translate(100 464)"><rect width="480" height="110" rx="20" fill="#fff8e7" stroke="#e69a18" stroke-width="2"/><text x="240" y="48" class="nt">高压输电网</text><text x="240" y="82" class="ns">远距离、大容量输送</text></g>
    <g transform="translate(100 630)"><rect width="480" height="110" rx="20" fill="#e7f8f3" stroke="#0e9b82" stroke-width="2"/><text x="240" y="48" class="nt">降压变电站</text><text x="240" y="82" class="ns">靠近负荷中心逐级降压</text></g>
    <g transform="translate(100 796)"><rect width="480" height="110" rx="20" fill="#fff3ed" stroke="#eb7543" stroke-width="2"/><text x="240" y="48" class="nt">中低压配电</text><text x="240" y="82" class="ns">馈线与配电变压器</text></g>
    <g transform="translate(100 962)"><rect width="480" height="110" rx="20" fill="#fff" stroke="#78909a" stroke-width="2"/><text x="240" y="48" class="nt">终端用户</text><text x="240" y="82" class="ns">常见 220/380 V</text></g>
  </g>
  <g class="edge" text-anchor="start"><text x="365" y="269">汇集</text><text x="365" y="435">升压</text><text x="365" y="601">远送</text><text x="365" y="767">降压</text><text x="365" y="933">配用</text></g>
  <g transform="translate(44 1125)"><rect width="592" height="238" rx="22" fill="#fff" stroke="#cce6df" stroke-width="2"/><text x="28" y="48" class="nt">升压为何能降损？</text><text x="28" y="98" class="formula">P = U × I</text><text x="245" y="98" class="small">功率不变：U ↑，I ↓</text><text x="28" y="154" class="formula">P<tspan baseline-shift="sub" font-size="18">损耗</tspan> = I² × R</text><text x="28" y="202" class="small">电流越小，线路发热损耗越低。</text></g>
</svg>
